<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 836" role="img" aria-labelledby="rqd-title rqd-desc">
  <title id="rqd-title">Request path: from a viewer to the private S3 bucket</title>
  <desc id="rqd-desc">A viewer looks up nalinkaheshan.dev at Cloudflare DNS, which has its proxy off and points at CloudFront. The HTTPS request goes to the CloudFront distribution, which uses an ACM certificate. A viewer-request CloudFront Function rewrites /path to /path/index.html before the cache lookup. On a cache miss, Origin Access Control signs the request with SigV4 and reads the object from a private S3 bucket whose policy allows s3:GetObject only from this one distribution.</desc>
