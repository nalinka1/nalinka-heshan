<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1536" role="img" aria-labelledby="mcm-title mcm-desc">
<title id="mcm-title">Cross-cloud OIDC workload identity federation, step by step</title>
<desc id="mcm-desc">A vertical path showing how an Azure workload reads an encrypted object in AWS without any stored access key. The workload asks the local metadata endpoint for a token, Entra ID issues a signed JWT, AWS STS validates the audience and subject claims against the role's trust policy, and returns short-lived credentials. Those credentials read only the inbound prefix, and S3 must separately ask KMS to unwrap the data key. Four negative tests confirm a wrong identity, an expired token, an out-of-scope prefix and a missing KMS grant are all denied.</desc>

<defs>
<style>
.mcm-bg{fill:#FBFBF9}
.mcm-h1{font-family:'IBM Plex Sans',sans-serif;font-size:22px;font-weight:600;fill:#16181D}
.mcm-sub{font-family:'IBM Plex Sans',sans-serif;font-size:13px;fill:#5C626E}
.mcm-t{font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:#16181D}
.mcm-s{font-family:'IBM Plex Sans',sans-serif;font-size:12px;fill:#5C626E}
.mcm-m{font-family:'IBM Plex Mono',monospace;font-size:12px;fill:#17505C}
.mcm-mk{font-family:'IBM Plex Mono',monospace;font-size:12px;fill:#16181D}
.mcm-lbl{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;fill:#5C626E}
.mcm-hd{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;fill:#16181D}
.mcm-card{fill:#FFFFFF;stroke:#DFE0DC;stroke-width:1}
.mcm-band{fill:#EDF2F2;stroke:#DFE0DC;stroke-width:1}
.mcm-acct{fill:none;stroke:#DFE0DC;stroke-width:1}
.mcm-rule{stroke:#DFE0DC;stroke-width:1}
.mcm-arr{fill:none;stroke:#5C626E;stroke-width:1.5}
.mcm-tok{fill:none;stroke:#17505C;stroke-width:1.5}
.mcm-num{fill:#17505C}
.mcm-numt{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;fill:#FFFFFF}
.mcm-ico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mcm-ti-id{fill:#E9EAF3}
.mcm-ic-id{stroke:#4A5578}
.mcm-ti-da{fill:#E6EEF3}
.mcm-ic-da{stroke:#2E5E7E}
.mcm-ti-se{fill:#E8F0E6}
.mcm-ic-se{stroke:#4A6B45}
.mcm-ti-ed{fill:#E3EEEF}
.mcm-ic-ed{stroke:#17505C}
</style>

<marker id="mcm-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C626E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="mcm-aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#17505C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>

<symbol id="mcm-sym-id" viewBox="0 0 18 18"><circle class="mcm-ico" cx="9" cy="6" r="3.2"/><path class="mcm-ico" d="M3 15.2c0-3.3 2.7-5.2 6-5.2s6 1.9 6 5.2"/></symbol>
<symbol id="mcm-sym-token" viewBox="0 0 18 18"><rect class="mcm-ico" x="2.2" y="5" width="13.6" height="8" rx="1.6"/><path class="mcm-ico" d="M5 9h3M10 9h3"/></symbol>
<symbol id="mcm-sym-lock" viewBox="0 0 18 18"><rect class="mcm-ico" x="3.6" y="7.6" width="10.8" height="7.4" rx="1.6"/><path class="mcm-ico" d="M6.2 7.6V5.6a2.8 2.8 0 0 1 5.6 0v2"/></symbol>
<symbol id="mcm-sym-bucket" viewBox="0 0 18 18"><ellipse class="mcm-ico" cx="9" cy="4.6" rx="6" ry="2.3"/><path class="mcm-ico" d="M3 4.6v8.8c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3V4.6"/></symbol>
<symbol id="mcm-sym-key" viewBox="0 0 18 18"><circle class="mcm-ico" cx="5.8" cy="9" r="3"/><path class="mcm-ico" d="M8.8 9H16M13.4 9v3M16 9v3.4"/></symbol>
<symbol id="mcm-sym-clock" viewBox="0 0 18 18"><circle class="mcm-ico" cx="9" cy="9" r="6.4"/><path class="mcm-ico" d="M9 5.2V9l2.6 1.8"/></symbol>
<symbol id="mcm-sym-check" viewBox="0 0 18 18"><path class="mcm-ico" d="M3 9.4 7 13.4 15 4.8"/></symbol>
</defs>

<rect class="mcm-bg" x="0" y="0" width="360" height="1536"/>

<text class="mcm-h1" x="24" y="40">Cross-cloud federation</text>
<text class="mcm-sub" x="24" y="62">No AWS access key exists on the Azure side</text>

<rect class="mcm-acct" x="18" y="80" width="324" height="256" rx="14"/>
<text class="mcm-lbl" x="30" y="326">Azure subscription</text>

<rect class="mcm-card" x="30" y="96" width="300" height="86" rx="10"/>
<rect class="mcm-ti-id" x="42" y="108" width="30" height="30" rx="7"/>
<use class="mcm-ic-id" href="#mcm-sym-id" x="48" y="114" width="18" height="18"/>
<text class="mcm-t" x="82" y="127">Azure workload</text>
<text class="mcm-s" x="42" y="155">User-assigned managed identity</text>
<text class="mcm-m" x="42" y="173">id-mcdp-reader</text>

<path class="mcm-tok" d="M180 182 V214" marker-end="url(#mcm-aht)"/>
<circle class="mcm-num" cx="180" cy="198" r="11"/>
<text class="mcm-numt" x="180" y="202" text-anchor="middle">1</text>

<rect class="mcm-card" x="30" y="214" width="300" height="86" rx="10"/>
<rect class="mcm-ti-id" x="42" y="226" width="30" height="30" rx="7"/>
<use class="mcm-ic-id" href="#mcm-sym-token" x="48" y="232" width="18" height="18"/>
<text class="mcm-t" x="82" y="245">Entra ID</text>
<text class="mcm-s" x="42" y="273">Signed JWT, subject is the identity</text>
<text class="mcm-m" x="42" y="291">sts.windows.net issuer</text>

<path class="mcm-tok" d="M180 300 V372" marker-end="url(#mcm-aht)"/>
<circle class="mcm-num" cx="180" cy="344" r="11"/>
<text class="mcm-numt" x="180" y="348" text-anchor="middle">2</text>

<rect class="mcm-acct" x="18" y="356" width="324" height="528" rx="14"/>
<text class="mcm-lbl" x="30" y="874">AWS account</text>

<rect class="mcm-card" x="30" y="372" width="300" height="86" rx="10"/>
<rect class="mcm-ti-id" x="42" y="384" width="30" height="30" rx="7"/>
<use class="mcm-ic-id" href="#mcm-sym-id" x="48" y="390" width="18" height="18"/>
<text class="mcm-t" x="82" y="403">AWS STS</text>
<text class="mcm-s" x="42" y="431">Signature checked offline via JWKS</text>
<text class="mcm-m" x="42" y="449">AssumeRoleWithWebIdentity</text>

<path class="mcm-tok" d="M180 458 V490" marker-end="url(#mcm-aht)"/>
<circle class="mcm-num" cx="180" cy="474" r="11"/>
<text class="mcm-numt" x="180" y="478" text-anchor="middle">3</text>

<rect class="mcm-card" x="30" y="490" width="300" height="86" rx="10"/>
<rect class="mcm-ti-se" x="42" y="502" width="30" height="30" rx="7"/>
<use class="mcm-ic-se" href="#mcm-sym-lock" x="48" y="508" width="18" height="18"/>
<text class="mcm-t" x="82" y="521">Federated IAM role</text>
<text class="mcm-s" x="42" y="549">Short-lived credentials, nothing stored</text>
<text class="mcm-m" x="42" y="567">mcdp-databricks-federated-role</text>

<path class="mcm-tok" d="M180 576 V608" marker-end="url(#mcm-aht)"/>
<circle class="mcm-num" cx="180" cy="592" r="11"/>
<text class="mcm-numt" x="180" y="596" text-anchor="middle">4</text>

<rect class="mcm-card" x="30" y="608" width="300" height="86" rx="10"/>
<rect class="mcm-ti-da" x="42" y="620" width="30" height="30" rx="7"/>
<use class="mcm-ic-da" href="#mcm-sym-bucket" x="48" y="626" width="18" height="18"/>
<text class="mcm-t" x="82" y="639">S3 document store</text>
<text class="mcm-s" x="42" y="667">Read scoped to one prefix only</text>
<text class="mcm-m" x="42" y="685">mcdp-documents-nh01/inbound/</text>

<path class="mcm-arr" d="M180 694 V726" marker-end="url(#mcm-ah)"/>
<circle class="mcm-num" cx="180" cy="710" r="11"/>
<text class="mcm-numt" x="180" y="714" text-anchor="middle">5</text>

<rect class="mcm-card" x="30" y="726" width="300" height="86" rx="10"/>
<rect class="mcm-ti-se" x="42" y="738" width="30" height="30" rx="7"/>
<use class="mcm-ic-se" href="#mcm-sym-key" x="48" y="744" width="18" height="18"/>
<text class="mcm-t" x="82" y="757">Customer-managed KMS key</text>
<text class="mcm-s" x="42" y="785">A second, independent grant</text>
<text class="mcm-m" x="42" y="803">alias/mcdp-documents</text>

<rect class="mcm-card" x="18" y="908" width="324" height="168" rx="10"/>
<path class="mcm-band" d="M18 908h304a10 10 0 0 1 10 10v22H18Z"/>
<text class="mcm-hd" x="32" y="929">Trust policy conditions</text>
<text class="mcm-s" x="32" y="962">Principal</text>
<text class="mcm-mk" x="140" y="962">OIDC provider ARN</text>
<text class="mcm-s" x="32" y="986">Issuer</text>
<text class="mcm-mk" x="140" y="986">pinned structurally</text>
<text class="mcm-s" x="32" y="1010">:aud equals</text>
<text class="mcm-mk" x="140" y="1010">api://&lt;api-app-id&gt;</text>
<text class="mcm-s" x="32" y="1034">:sub equals</text>
<text class="mcm-mk" x="140" y="1034">identity principal ID</text>
<text class="mcm-s" x="32" y="1060">There is no :iss condition key in IAM.</text>

<rect class="mcm-card" x="18" y="1100" width="324" height="208" rx="10"/>
<path class="mcm-band" d="M18 1100h304a10 10 0 0 1 10 10v22H18Z"/>
<text class="mcm-hd" x="32" y="1121">Negative tests - all denied</text>
<use class="mcm-ic-se" href="#mcm-sym-check" x="32" y="1144" width="18" height="18"/>
<text class="mcm-s" x="60" y="1150">A different managed identity</text>
<text class="mcm-m" x="60" y="1168">AccessDenied at STS</text>
<use class="mcm-ic-se" href="#mcm-sym-clock" x="32" y="1184" width="18" height="18"/>
<text class="mcm-s" x="60" y="1190">Credentials past expiry</text>
<text class="mcm-m" x="60" y="1208">ExpiredToken</text>
<use class="mcm-ic-se" href="#mcm-sym-bucket" x="32" y="1224" width="18" height="18"/>
<text class="mcm-s" x="60" y="1230">A prefix outside inbound/</text>
<text class="mcm-m" x="60" y="1248">AccessDenied at S3</text>
<use class="mcm-ic-se" href="#mcm-sym-key" x="32" y="1264" width="18" height="18"/>
<text class="mcm-s" x="60" y="1270">kms:Decrypt removed</text>
<text class="mcm-m" x="60" y="1288">AccessDenied, cause is KMS</text>

<line class="mcm-rule" x1="18" y1="1336" x2="342" y2="1336"/>

<text class="mcm-hd" x="24" y="1364">Legend</text>
<rect class="mcm-ti-id" x="24" y="1378" width="16" height="16" rx="4"/>
<text class="mcm-s" x="48" y="1390">Identity</text>
<rect class="mcm-ti-da" x="130" y="1378" width="16" height="16" rx="4"/>
<text class="mcm-s" x="154" y="1390">Data</text>
<rect class="mcm-ti-se" x="226" y="1378" width="16" height="16" rx="4"/>
<text class="mcm-s" x="250" y="1390">Security</text>
<path class="mcm-tok" d="M24 1414h26" marker-end="url(#mcm-aht)"/>
<text class="mcm-s" x="58" y="1418">Token or credential path</text>
<path class="mcm-arr" d="M226 1414h26" marker-end="url(#mcm-ah)"/>
<text class="mcm-s" x="260" y="1418">Synchronous</text>

<text class="mcm-hd" x="24" y="1448">Flow</text>
<circle class="mcm-num" cx="35" cy="1468" r="11"/>
<text class="mcm-numt" x="35" y="1472" text-anchor="middle">1</text>
<text class="mcm-s" x="56" y="1472">Token requested with no credential sent</text>
<circle class="mcm-num" cx="35" cy="1492" r="11"/>
<text class="mcm-numt" x="35" y="1496" text-anchor="middle">2</text>
<text class="mcm-s" x="56" y="1496">Signed JWT presented to AWS STS</text>
<circle class="mcm-num" cx="35" cy="1516" r="11"/>
<text class="mcm-numt" x="35" y="1520" text-anchor="middle">3</text>
<text class="mcm-s" x="56" y="1520">Audience and subject claims must match</text>
<circle class="mcm-num" cx="187" cy="1468" r="11"/>
<text class="mcm-numt" x="187" y="1472" text-anchor="middle">4</text>
<text class="mcm-s" x="208" y="1472">Read inbound/ only</text>
<circle class="mcm-num" cx="187" cy="1492" r="11"/>
<text class="mcm-numt" x="187" y="1496" text-anchor="middle">5</text>
<text class="mcm-s" x="208" y="1496">KMS unwraps the key</text>
</svg>
