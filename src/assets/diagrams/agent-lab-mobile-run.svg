<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1250" role="img" aria-labelledby="afm-title afm-desc">
<title id="afm-title">One run of the agent failure lab, step by step</title>
<desc id="afm-desc">A vertical path of one run. The harness picks a case and an attempt and restores the seed payment history. The agent loop sends the conversation and nine tool schemas to an OpenAI model, which answers with tool calls. The tools are dispatched and their results, including errors, go back as data, repeating for up to twelve steps. A terminal tool ends the run, and only approve for payment writes a record. Every event is appended to a trace file, and a script builds a per-case table from the traces. Across fifty runs: 44 correct, 4 false approvals, 8 of 10 cases with full agreement, a median of 3 steps, and about four cents in total.</desc>

