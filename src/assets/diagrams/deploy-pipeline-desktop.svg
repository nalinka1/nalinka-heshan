      .dpd-m{font-family:'IBM Plex Mono',monospace;fill:#16181D;font-size:12px}
      .dpd-mm{font-family:'IBM Plex Mono',monospace;fill:#5C626E;font-size:12px}
      .dpd-mb{font-family:'IBM Plex Mono',monospace;fill:#16181D;font-size:12px;font-weight:600}
      .dpd-k{font-family:'IBM Plex Mono',monospace;fill:#17505C;font-size:12px;font-weight:600}
