      .dpd-h{font-family:'IBM Plex Sans',sans-serif;fill:#16181D;font-size:14px;font-weight:600}
      .dpd-nt{font-family:'IBM Plex Sans',sans-serif;fill:#16181D;font-size:13px;font-weight:600}
      .dpd-s{font-family:'IBM Plex Sans',sans-serif;fill:#5C626E;font-size:12px}
