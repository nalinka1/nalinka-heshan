  <text x="430" y="752" class="dpd-s">Requests an OIDC token from GitHub</text>
  <circle cx="412" cy="770" r="10" class="dpd-num"/>
  <text x="412" y="774" class="dpd-numt">4</text>
  <text x="430" y="774" class="dpd-s">Sends the token to AWS STS</text>
  <circle cx="688" cy="704" r="10" class="dpd-num"/>
