<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="dpd-title dpd-desc">
  <title id="dpd-title">Deploy pipeline: from a push to master to a live site, with no stored AWS keys</title>
  <desc id="dpd-desc">A push to master starts a GitHub Actions workflow that builds the site. The runner requests a short-lived OIDC token from GitHub and sends it to AWS STS. STS checks the IAM role trust policy, which requires the sts.amazonaws.com audience and a subject naming this repository and branch, then issues temporary credentials for the deploy role. With those, the workflow syncs the build to the S3 bucket, HTML last, and invalidates the CloudFront distribution. The role can only write to one bucket and invalidate one distribution.</desc>
