  <text x="564" y="348" class="dpd-h">IAM role</text>
  <text x="524" y="388" class="dpd-m">nalinkaheshan-dev</text>
  <text x="564" y="365" class="dpd-m">gha-deploy-</text>
  <rect x="724" y="320" width="176" height="80" rx="10" class="dpd-card"/>
  <rect x="736" y="332" width="30" height="30" rx="7" fill="#E8F0E6"/>
