  <text x="734" y="482" class="dpd-m">sub</text>
  <text x="890" y="482" class="dpd-x" text-anchor="end">repo IDs + master</text>
  <rect x="512" y="428" width="168" height="147" rx="8" class="dpd-card"/>
  <path d="M512 450V436a8 8 0 0 1 8 -8h152a8 8 0 0 1 8 8V450z" fill="#E8F0E6"/>
  <text x="522" y="443" class="dpd-mb">Role permissions</text>
  <text x="522" y="464" class="dpd-s">This bucket only</text>
  <text x="522" y="481" class="dpd-m">s3:PutObject</text>
  <text x="522" y="498" class="dpd-m">s3:DeleteObject</text>
