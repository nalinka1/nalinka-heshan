  <text x="218" y="374" class="dpd-x" text-anchor="end">default</text>
  <text x="70" y="392" class="dpd-m">cv.pdf</text>
  <text x="218" y="392" class="dpd-k" text-anchor="end">no-cache</text>
  <text x="70" y="410" class="dpd-m">*.html</text>
  <text x="218" y="410" class="dpd-k" text-anchor="end">no-cache</text>
  <text x="70" y="428" class="dpd-s">HTML goes last</text>
  <rect x="286" y="320" width="168" height="80" rx="10" class="dpd-card"/>
