      .dpd-out{fill:#FFFFFF;stroke:#B9BCB5;stroke-width:1;stroke-dasharray:4 3}
      .dpd-ln{fill:none;stroke:#5C626E;stroke-width:1.5}
      .dpd-dash{stroke-dasharray:5 4}
      .dpd-plain{fill:none;stroke:#B9BCB5;stroke-width:1.25;stroke-dasharray:4 3}
      .dpd-cfg{fill:none;stroke:#17505C;stroke-width:1.75;stroke-dasharray:0.5 5;stroke-linecap:round}
      .dpd-cred{fill:none;stroke:#17505C;stroke-width:1.75}
      .dpd-ico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .dpd-num{fill:#17505C}
      .dpd-numt{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;fill:#FFFFFF;text-anchor:middle}
    </style>
