  <circle cx="688" cy="748" r="10" class="dpd-num"/>
  <text x="688" y="752" class="dpd-numt">7</text>
  <text x="706" y="752" class="dpd-s">Invalidates <tspan class="dpd-m">/*</tspan> on the distribution</text>
</svg>
