name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::103608802055:role/gha-deploy-nalinkaheshan-dev
          aws-region: us-east-1

      # Hashed, fingerprinted build output (_astro/*) — safe to cache for a year
      - run: aws s3 sync dist/ s3://nalinkaheshan.dev/ --delete --exclude "*" --include "_astro/*" --cache-control "public,max-age=31536000,immutable"

      # Everything else that isn't HTML (favicon, etc.) — not fingerprinted, default caching
      - run: aws s3 sync dist/ s3://nalinkaheshan.dev/ --delete --exclude "*.html" --exclude "_astro/*" --exclude "cv.pdf"

      # cv.pdf — not fingerprinted, and an updated CV must not serve stale from cache
      - run: aws s3 cp dist/cv.pdf s3://nalinkaheshan.dev/cv.pdf --cache-control "no-cache"

      # HTML last, after the assets it references exist — revalidate every time, directory-style URLs carry no fingerprint
      - run: aws s3 sync dist/ s3://nalinkaheshan.dev/ --delete --exclude "*" --include "*.html" --cache-control "no-cache"

      - run: aws cloudfront create-invalidation --distribution-id E180MMWNYX0QCC --paths "/*"
