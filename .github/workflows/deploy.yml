name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::103608802055:role/gha-deploy-nalinkaheshan-dev
          aws-region: us-east-1

      - run: aws s3 sync dist/ s3://nalinkaheshan.dev/ --delete

      - run: aws cloudfront create-invalidation --distribution-id E180MMWNYX0QCC --paths "/*"
